id: com.visualstudio.code.tool.fish
branch: '25.08'
build-extension: true
sdk: org.freedesktop.Sdk//25.08
runtime: com.visualstudio.code
runtime-version: stable
separate-locales: false
build-options:
  prefix: /app/tools/fish
  strip: true
cleanup:
  - '*.a'
  - '*.la'
  - /share/man
# add-build-extensions doesn't work but this does!?
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
modules:
  - name: fish
    buildsystem: cmake-ninja
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/fish/cargo
      ldflags: -ltinfo
    sources:
      - type: archive
        url: https://github.com/fish-shell/fish-shell/releases/download/4.0.6/fish-4.0.6.tar.xz
        sha256: 125d9ce0dd8a3704dc0782925df34f0208bffc42af5f34914449d14c34b5dae1
        x-checker-data:
          type: json
          url: https://api.github.com/repos/fish-shell/fish-shell/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="fish-\($version).tar.xz") | .browser_download_url
      - cargo-sources.json

  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: com.visualstudio.code.tool.fish.metainfo.xml
