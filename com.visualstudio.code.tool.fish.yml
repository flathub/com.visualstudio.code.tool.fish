id: com.visualstudio.code.tool.fish
branch: '25.08'
build-extension: true
sdk: org.freedesktop.Sdk//25.08
runtime: com.visualstudio.code
runtime-version: stable
separate-locales: false
build-options:
  prefix: /app/tools/fish
  prepend-path: /usr/lib/sdk/rust-stable/bin
  ## strip == true causes build failure due to read-only file system
  strip: false
cleanup:
  - '*.a'
  - '*.la'
  - /share/man
# add-build-extensions doesn't work but this does!?
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
modules:
  - name: fish
    buildsystem: cmake-ninja
    build-options:
      env:
        CARGO_HOME: /run/build/fish/cargo
      ldflags: -ltinfo
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app/tools/fish
    sources:
      - type: archive
        url: https://github.com/fish-shell/fish-shell/releases/download/4.7.1/fish-4.7.1.tar.xz
        sha256: 6f4d5b438a6338e3f5dcda19a28261e2ece7a9b7ff97686685e6abdc31dbb7df
        x-checker-data:
          type: json
          url: https://api.github.com/repos/fish-shell/fish-shell/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="fish-\($version).tar.xz") | .browser_download_url
      - cargo-sources.json

  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: com.visualstudio.code.tool.fish.metainfo.xml
